services:
  postgres:
    image: postgres:15-alpine
    container_name: SpikeVerse-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-SpikeVerse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SpikeVerse_password}
      POSTGRES_DB: ${DB_NAME:-SpikeVerse_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-SpikeVerse_user} -d ${DB_NAME:-SpikeVerse_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"
    restart: always

  minio:
    image: minio/minio:latest
    container_name: SpikeVerse-minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9090:9001"
    volumes:
      - minio_data:/minio_data
    command: server /minio_data --console-address ":9090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live" ]
      interval: 4s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
    restart: always

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.cpu
    container_name: SpikeVerse-backend
    init: true
    network_mode: host
    environment:
      - MPLBACKEND=Agg
      - QT_QPA_PLATFORM=offscreen
      - PYGLET_HEADLESS=1
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DISPLAY=
      - DB_HOST=127.0.0.1
      - DB_PORT=5432
      - DB_USER=${DB_USER:-SpikeVerse_user}
      - DB_PASSWORD=${DB_PASSWORD:-SpikeVerse_password}
      - DB_NAME=${DB_NAME:-SpikeVerse_db}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      - STORAGE_TYPE=minio
      - STORAGE_ENDPOINT_URL=http://127.0.0.1:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_BUCKET=SpikeVerse-models
      - STORAGE_REGION=us-east-1
      - STORAGE_PATH_STYLE=true
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-245799124926-sknmlhsif6kue8f5ksmpqj7ktrm26cdv.apps.googleusercontent.com}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-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}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-https://spike-verse.oriol-tech.com/api/auth/google/callback}
      - FRONTEND_URL=${FRONTEND_URL:-https://spike-verse.oriol-tech.com}
      - TEMP_ARCHIVE_DIR=/tmp/snn_archives
    # For USB serial (local): uncomment and adjust for your device
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyACM0:/dev/ttyACM0
    group_add:
      - dialout
    volumes:
      - ./back:/app
      - genn_models:/tmp/genn_models
      - snn_archives:/tmp/snn_archives
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "2"
        reservations:
          memory: 8G
          cpus: "1"
    ulimits:
      stack:
        soft: -1
        hard: -1
    stop_grace_period: 30s
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://127.0.0.1:8000/api/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: always

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: SpikeVerse-frontend
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1//index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always

volumes:
  genn_models:
    driver: local
  snn_archives:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local
