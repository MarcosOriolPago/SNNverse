services:
  postgres:
    image: postgres:15-alpine
    container_name: snnverse-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-snnverse_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-snnverse_password}
      POSTGRES_DB: ${DB_NAME:-snnverse_db}
    # ports:
    #   - "5432:5432"
    network_mode: host
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-snnverse_user} -d ${DB_NAME:-snnverse_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1"

  minio:
    image: minio/minio:latest
    container_name: snnverse-minio
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    # ports:
    #   - "9000:9000"
    #   - "9090:9001"
    network_mode: host
    volumes:
      - minio_data:/minio_data
    # networks:
    #   - snnverse-network
    command: server /minio_data --console-address ":9090"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"

  backend:
    build:
      context: ./back
      dockerfile: Dockerfile.cpu
    container_name: snnverse-backend
    environment:
      - MPLBACKEND=Agg              # Forces Matplotlib to render invisibly without X11
      - QT_QPA_PLATFORM=offscreen   # Forces PyQt/Qt to run headlessly
      - PYGLET_HEADLESS=1           # Forces Pyglet (often used in AI/RL) to run headlessly
      - DISPLAY=:99
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DISPLAY=
      - QT_QPA_PLATFORM=offscreen
      # Database Configuration
      - DB_HOST=localhost
      - DB_PORT=5432
      - DB_USER=${DB_USER:-snnverse_user}
      - DB_PASSWORD=${DB_PASSWORD:-snnverse_password}
      - DB_NAME=${DB_NAME:-snnverse_db}
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=20
      # Storage Configuration (MinIO)
      - STORAGE_TYPE=minio
      - STORAGE_ENDPOINT_URL=http://localhost:9000
      - STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY:-minioadmin}
      - STORAGE_SECRET_KEY=${STORAGE_SECRET_KEY:-minioadmin}
      - STORAGE_BUCKET=snnverse-models
      - STORAGE_REGION=us-east-1
      - STORAGE_PATH_STYLE=true
      # Artifact Storage
      - TEMP_ARCHIVE_DIR=/tmp/snn_archives
    volumes:
      - ./back:/app
      - genn_models:/tmp/genn_models
      - snn_archives:/tmp/snn_archives
    # networks:
    #   - snnverse-network
    network_mode: host
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    # CPU-only resource limits
    deploy:
      resources:
        limits:
          memory: 12G
          cpus: "2"
        reservations:
          memory: 8G
          cpus: "1"
    healthcheck:
      test: [ "CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: snnverse-frontend
    # ports:
    #   - "80:80"
    depends_on:
      - backend
    # networks:
    #   - snnverse-network
    network_mode: host
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/index.html" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  genn_models:
    driver: local
  snn_archives:
    driver: local
  postgres_data:
    driver: local
  minio_data:
    driver: local

# networks:
#   snnverse-network:
#     driver: bridge
