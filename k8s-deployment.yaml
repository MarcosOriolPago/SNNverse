apiVersion: v1
kind: Namespace
metadata:
  name: snnverse

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: genn-models-pvc
  namespace: snnverse
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: snnverse
  labels:
    app: backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        version: v1
    spec:
      containers:
      - name: backend
        image: REGION-docker.pkg.dev/PROJECT/REPO/backend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: api
          containerPort: 8000
          protocol: TCP
        - name: runner-tcp
          containerPort: 9001
          protocol: TCP
        - name: runner-ws
          containerPort: 9002
          protocol: TCP
        env:
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        resources:
          limits:
            nvidia.com/gpu: 1
            memory: 4Gi
            cpu: 2
          requests:
            nvidia.com/gpu: 1
            memory: 2Gi
            cpu: 1
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: genn-models
          mountPath: /tmp/genn_models
      volumes:
      - name: genn-models
        persistentVolumeClaim:
          claimName: genn-models-pvc
      nodeSelector:
        cloud.google.com/gke-accelerator: nvidia-tesla-v100

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: snnverse
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: api
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: runner-tcp
    port: 9001
    targetPort: 9001
    protocol: TCP
  - name: runner-ws
    port: 9002
    targetPort: 9002
    protocol: TCP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: snnverse
  labels:
    app: frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      containers:
      - name: frontend
        image: REGION-docker.pkg.dev/PROJECT/REPO/frontend:v1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          limits:
            memory: 512Mi
            cpu: 500m
          requests:
            memory: 256Mi
            cpu: 250m
        livenessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /index.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 2

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: snnverse
  labels:
    app: frontend
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: snnverse-network-policy
  namespace: snnverse
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector: {}
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
  egress:
  - to:
    - podSelector: {}
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
